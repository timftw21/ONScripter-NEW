[workspace]
members = ["Rust/core", "Rust/platform", "Rust/render", "Rust/cli", "Rust/android"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-2.0-or-later"

[workspace.dependencies]
onscripter-core = { path = "Rust/core" }
onscripter-platform = { path = "Rust/platform" }
onscripter-render = { path = "Rust/render" }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
cap-std = "4.0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

# Use the normal MSVC runtime for SDL while retaining native debug symbols.
[profile.dev.package.sdl3-sys]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

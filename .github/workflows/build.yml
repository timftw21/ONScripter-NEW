name: build

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: read

jobs:
  macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
            package-arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            package-arch: x86_64
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: brew install autoconf automake libtool cmake meson ninja nasm pkg-config
      - name: Configure
        run: ./configure --release-build --std=gnu++23 --with-werror
      - name: Build
        run: make -k -j2
      - name: Native regression tests
        run: |
          cmake -S Tests -B DerivedData/tests -G Ninja
          cmake --build DerivedData/tests --parallel 2
          ctest --test-dir DerivedData/tests --output-on-failure
      - name: Package macOS app
        run: >-
          bash Scripts/macbuild.tool DerivedData/MacOSX-${{ matrix.arch }}
          DerivedData/Release/onscripter-new-macos-${{ matrix.package-arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: onscripter-new-macos-${{ matrix.package-arch }}
          path: DerivedData/Release/onscripter-new-macos-${{ matrix.package-arch }}.zip
          if-no-files-found: error

  windows-ucrt64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Configure
        shell: msys2 {0}
        run: ./configure --release-build --std=gnu++23 --with-werror
      - name: Build
        shell: msys2 {0}
        run: make -j2
      - name: Native regression tests
        shell: msys2 {0}
        run: |
          cmake -S Tests -B DerivedData/tests -G Ninja
          cmake --build DerivedData/tests
          ctest --test-dir DerivedData/tests --output-on-failure

  linux-sanitizers-and-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      FUZZ_RUNS: ${{ github.event_name == 'schedule' && '100000' || '5000' }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Clang and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang ninja-build
      - name: Configure sanitizer and fuzz targets
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S Tests -B DerivedData/tests-sanitize -G Ninja
          -DONS_ENABLE_SANITIZERS=ON
          -DONS_BUILD_FUZZERS=ON
      - name: Build
        run: cmake --build DerivedData/tests-sanitize
      - name: Run regression tests under ASan and UBSan
        run: ctest --test-dir DerivedData/tests-sanitize --output-on-failure
      - name: Fuzz archive indexes
        run: >-
          DerivedData/tests-sanitize/fuzz_archive_parser
          -runs="$FUZZ_RUNS" -max_len=65536 -timeout=5
      - name: Fuzz command-line validation
        run: >-
          DerivedData/tests-sanitize/fuzz_command_line
          -runs="$FUZZ_RUNS" -max_len=65536 -timeout=5
      - name: Fuzz serialized-data reads
        run: >-
          DerivedData/tests-sanitize/fuzz_serialized_data
          -runs="$FUZZ_RUNS" -max_len=65536 -timeout=5
      - name: Fuzz regular expressions
        run: >-
          DerivedData/tests-sanitize/fuzz_slre
          -runs="$FUZZ_RUNS" -max_len=65536 -timeout=5

  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
          else
            git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
          fi

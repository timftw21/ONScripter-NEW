name: build

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: read

jobs:
  rust-rewrite:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Load pinned Rust toolchain
        run: rustup show
      - name: Install SDL3 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust code
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Rust rewrite
        run: cargo build --workspace --release --locked
      - name: Run existing synthetic script
        run: cargo run --release --locked -- run Tests/Fixtures/SmokeGame/0.txt
      - name: Check Android ARM64 compilation
        if: runner.os == 'Linux'
        run: cargo check --workspace --target aarch64-linux-android --locked
      - uses: actions/setup-java@v5
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build components
        if: runner.os == 'Linux'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"'
      - name: Build Rust Android APK
        if: runner.os == 'Linux'
        working-directory: Rust/android
        run: bash ./gradlew --no-daemon --console plain assembleDebug
      - name: Check Android APK alignment
        if: runner.os == 'Linux'
        run: '"$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 Rust/android/build/outputs/apk/debug/onscripter-rust-debug.apk'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: onscripter-rust-android-debug
          path: Rust/android/build/outputs/apk/debug/onscripter-rust-debug.apk
          if-no-files-found: error

  windows-ucrt64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Configure
        shell: msys2 {0}
        run: ./configure --release-build --std=gnu++23 --with-werror
      - name: Build
        shell: msys2 {0}
        run: make -j2
      - name: Native regression tests
        shell: msys2 {0}
        run: |
          cmake -S Tests -B DerivedData/tests -G Ninja
          cmake --build DerivedData/tests
          ctest --test-dir DerivedData/tests --output-on-failure

  linux-sanitizers-and-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      FUZZ_RUNS: ${{ github.event_name == 'schedule' && '100000' || '5000' }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Clang and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang ninja-build
      - name: Configure sanitizer and fuzz targets
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S Tests -B DerivedData/tests-sanitize -G Ninja
          -DONS_ENABLE_SANITIZERS=ON
          -DONS_BUILD_FUZZERS=ON
      - name: Build
        run: cmake --build DerivedData/tests-sanitize
      - name: Run regression tests under ASan and UBSan
        run: ctest --test-dir DerivedData/tests-sanitize --output-on-failure
      - name: Fuzz archive indexes
        run: >-
          DerivedData/tests-sanitize/fuzz_archive_parser
          -runs="$FUZZ_RUNS" -max_len=65536 -timeout=5
      - name: Fuzz command-line validation
        run: >-
          DerivedData/tests-sanitize/fuzz_command_line
          -runs="$FUZZ_RUNS" -max_len=65536 -timeout=5
      - name: Fuzz serialized-data reads
        run: >-
          DerivedData/tests-sanitize/fuzz_serialized_data
          -runs="$FUZZ_RUNS" -max_len=65536 -timeout=5
      - name: Fuzz regular expressions
        run: >-
          DerivedData/tests-sanitize/fuzz_slre
          -runs="$FUZZ_RUNS" -max_len=65536 -timeout=5

  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
          else
            git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
          fi
